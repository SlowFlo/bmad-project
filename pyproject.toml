[project]
name = "exaequo"
version = "0.1.0"
description = "Ex Aequo — chatbot de mise en relation sportive"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exaequo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
